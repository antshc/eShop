# Standalone Aspire dashboard that loop exports telemetry to (OTLP/HTTP on localhost:4318).
#   docker compose -f tools/loop/compose.yaml up -d
# Telemetry is persisted per dashboard start in <repo>/.loop/dashboard (gitignored).
# Ports are bound to localhost and anonymous access is on: for local development only.
name: loop-dashboard

services:
  dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    container_name: loop-dashboard
    # The default bridge avoids creating a compose network (single service, nothing to resolve by name).
    network_mode: bridge
    # Run as the host user so the bind-mounted data directory stays writable and deletable by you.
    # Override with LOOP_UID/LOOP_GID when your ids are not 1000.
    user: "${LOOP_UID:-1000}:${LOOP_GID:-1000}"
    ports:
      - "127.0.0.1:${LOOP_DASHBOARD_PORT:-18888}:18888"
      - "127.0.0.1:${LOOP_OTLP_GRPC_PORT:-4317}:18889"
      - "127.0.0.1:${LOOP_OTLP_HTTP_PORT:-4318}:18890"
    volumes:
      - ../../.loop/dashboard:/data
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      ASPIRE_DASHBOARD_APPLICATION_NAME: eShop-loop
      ASPIRE_DASHBOARD_DATA_DIRECTORY: /data
      ASPIRE_DASHBOARD_PERSISTENCE_MODE: Run
    restart: unless-stopped
